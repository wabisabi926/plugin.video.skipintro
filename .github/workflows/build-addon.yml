name: Build Kodi Addon

# 触发条件：main 分支上 addon.xml 发生变化（即版本号更新）时自动打包
on:
  push:
    branches: [main]
    paths:
      - addon.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取 addon.xml 版本号
        id: ver
        run: |
          VERSION=$(sed -n 's/.*<addon[^>]*version="\([^"]*\)".*/\1/p' addon.xml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "无法从 addon.xml 读取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

      - name: 检查该版本是否已发布
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "标签 v${{ steps.ver.outputs.version }} 已存在，跳过打包"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包为 Kodi 插件 zip
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ADDON_ID="plugin.video.skipintro"
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$ADDON_ID"
          # Kodi 要求 zip 内顶层目录必须是插件 ID
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.workbuddy-ai' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'CHANGELOG.md' \
            ./ "$STAGE/$ADDON_ID/"
          cd "$STAGE"
          zip -rq "$ADDON_ID-$VERSION.zip" "$ADDON_ID"
          mv "$ADDON_ID-$VERSION.zip" "$GITHUB_WORKSPACE/"
          echo "打包完成，内容如下："
          unzip -l "$GITHUB_WORKSPACE/$ADDON_ID-$VERSION.zip"

      - name: 创建 GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: plugin.video.skipintro-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
